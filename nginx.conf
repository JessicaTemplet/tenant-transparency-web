server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve real files (including static article pages built into dist/).
    # For anything that doesn't match a file or directory, fall through to
    # the React SPA root so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Light compression for common asset types
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
