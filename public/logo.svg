<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" width="100%" height="100%">
  <g id="house-icon">
    <!-- House Outline -->
    <path d="M 25,65 L 75,22 L 125,65 M 39,62 V 118 H 111 V 62" 
          fill="none" 
          stroke="#1B365D" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Padlock Body -->
    <rect x="53" y="68" width="44" height="38" rx="6" fill="#FF5100"/>
    
    <!-- Padlock Shackle -->
    <path d="M 61,68 V 56 A 14,14 0 0,1 89,56 V 68" 
          fill="none" 
          stroke="#FF5100" 
          stroke-width="7" 
          stroke-linecap="round"/>
    
    <!-- Keyhole Dots -->
    <circle cx="75" cy="80" r="4" fill="#FFFFFF"/>
    <circle cx="75" cy="94" r="4" fill="#FFFFFF"/>
  </g>

  <g id="logo-text">
    <!-- TENANT -->
    <text x="150" y="62" 
          fill="#FF5100" 
          font-family="Arial, Helvetica, sans-serif" 
          font-weight="900" 
          font-size="48" 
          letter-spacing="10">TENANT</text>
    
    <!-- TRANSPARENCY -->
    <text x="150" y="98" 
          fill="#1B365D" 
          font-family="Arial, Helvetica, sans-serif" 
          font-weight="900" 
          font-size="30" 
          letter-spacing="1">TRANSPARENCY</text>
    
    <!-- Tagline -->
    <text x="25" y="148" 
          fill="#1B365D" 
          font-family="Arial, Helvetica, sans-serif" 
          font-weight="600" 
          font-size="22">Know Before You Lease.™</text>
  </g>
</svg>
